      { name: "Minoru Mineta", color: "#b86bff", glow: "#d3a6ff", desc: "Small in size, but his sticky grapes can trap any villain.", video: "./Static/mineta_gid.mp4", quiz: "./Quizzes/mineta.html", image: "./Static/mineta.webp" },
      { name: "Momo Yaoyorozu", color: "#ffb27a", glow: "#ffd8b5", desc: "A hero with unmatched intelligence and the power of creation.", video: "./Static/momo_gid.mp4", quiz: "./Quizzes/momo.html", image: "./Static/momo.png" },
      { name: "Neito Monoma", color: "#a0e1ff", glow: "#cff6ff", desc: "The copy hero with endless ambition and a flair for the dramatic!", video: "./Static/monoma_gid.mp4", quiz: "./Quizzes/monoma.html", image: "./Static/monoma.png" },
      { name: "Ochaco Uraraka", color: "#ff9dd8", glow: "#ffbfe6", desc: "A zero-gravity hero with a dream to lift others up.", video: "./Static/ochaco_uraraka_gid.mp4", quiz: "./Quizzes/uraraka.html", image: "./Static/ochaco_uraraka.png" },
      { name: "Hitoshi Shinso", color: "#8e44ad", glow: "#b58ed9", desc: "A hero with the power of brainwashing and the will to do good.", video: "./Static/shinso_gid.mp4", quiz: "./Quizzes/shinso.html", image: "./Static/shinso.png" },
      { name: "Shota Aizawa", color: "#9fa7a6", glow: "#cfd6d6", desc: "Eraserhead: The pro hero who works from the shadows.", video: "./Static/eraserhead_gid.mp4", quiz: "./Quizzes/aizawa.html", image: "./Static/shota_aizawa.jpg" },
      { name: "Shoto Todoroki", color: "#66ccff", glow: "#a6e6ff", desc: "Master of fire and ice, seeking his own path to greatness.", video: "./Static/todoroki_gid.mp4", quiz: "./Quizzes/todoroki.html", image: "./Static/shoto_todoroki.jpg" },
      { name: "Tenya Iida", color: "#4da6ff", glow: "#9fdcff", desc: "Ingenium: A speedster driven by duty, rules, and discipline.", video: "./Static/tenya_gid.mp4", quiz: "./Quizzes/iida.html", image: "./Static/tenya_iida.png" },
      { name: "Mirio Togata", color: "#ffd480", glow: "#ffe9b8", desc: "Lemillion: The man who can phase through any obstacle with a smile.", video: "./Static/mirio_gid.mp4", quiz: "./Quizzes/togata.html", image: "./Static/togata.png" },
      { name: "Fumikage Tokoyami", color: "#2b2b2b", glow: "#5a5a5a", desc: "A poetic hero master of the shadow, Tsukuyomi.", video: "./Static/tokoyami_gid.mp4", quiz: "./Quizzes/tokoyami.html", image: "./Static/tokoyami.png" }
    ];

    const startTimes = [6, 27, 4, 10, 5, 5, 6, 7, 0, 0, 15, 3, 9, 6, 8, 6, 9, 7, 4, 7, 3, 2, 12, 6, 4, 5];

    const bgVideo = document.getElementById("bgVideo");
    const heroCard = document.getElementById("heroCard");
    const indicator = document.getElementById("indicator");
    const audio = document.getElementById("myAudio");
    const startScreen = document.getElementById("start-screen");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");
    const fsBtn = document.getElementById("fullscreenButton");

    let index = 0;

    function hexToRgba(hex, alpha = 1) {
      const h = hex.replace('#','');
      const bigint = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function updateIndicator() {
      indicator.innerHTML = heroes.map((_, i) => `<span class="${i === index ? 'active' : ''}"></span>`).join('');
      const spans = indicator.querySelectorAll('span');
      spans.forEach((s, i) => {
        if (i === index) {
          s.style.background = hexToRgba(heroes[index].glow, 0.8);
          s.style.boxShadow = `0 0 15px ${hexToRgba(heroes[index].glow, 0.5)}`;
        }
      });
    }

    function applyTheme(hero) {
      const glow = hero.glow || hero.color;
      heroCard.style.boxShadow = `0 30px 60px rgba(0,0,0,0.6), 0 0 30px ${hexToRgba(glow, 0.3)}`;
      heroCard.style.borderColor = hexToRgba(hero.color, 0.4);
      
      const startBtnEl = heroCard.querySelector('.start-btn');
      if (startBtnEl) {
        startBtnEl.style.background = hero.color;
        startBtnEl.style.color = (hero.color === '#2b2b2b' || hero.color === '#0f0f0f') ? '#fff' : '#000';
        startBtnEl.style.boxShadow = `0 0 15px ${hexToRgba(glow, 0.4)}`;
      }
    }

    // Handle the Video Loop from specific startTimes
    bgVideo.onended = () => {
      bgVideo.currentTime = startTimes[index] || 0;
      bgVideo.play();
    };

    function showHero(i, direction = "right") {
      const hero = heroes[i];
      const start = startTimes[i] || 0;

      heroCard.classList.remove("slide-in");
      heroCard.classList.add(direction === "right" ? "slide-left" : "slide-right");

      setTimeout(() => {
        bgVideo.src = hero.video;
        bgVideo.onloadedmetadata = () => {
          try { bgVideo.currentTime = start; } catch (e) {}
          bgVideo.play().catch(()=>{});
        };

        heroCard.innerHTML = `
          <img src="${hero.image}" alt="${hero.name}">
          <div class="character-info">
            <h2>${hero.name}</h2>
            <p>${hero.desc}</p>
            <div class="button-group">
            <a href="${hero.quiz}" class="start-btn">Start Quiz</a>
            <button class="random-btn" id="randomBtn">🎲 Randomize</button>
            </div>
          </div>`;

          const randomBtn = document.getElementById("randomBtn");

          randomBtn.addEventListener("click", () => {
            let randomIndex;
            do {
              randomIndex = Math.floor(Math.random() * heroes.length);
            } while (randomIndex === index);

            index = randomIndex;
            showHero(index, Math.random() > 0.5 ? "left" : "right");
          });

        heroCard.classList.remove("slide-left", "slide-right");
        heroCard.classList.add("slide-in");

        setTimeout(()=> applyTheme(hero), 50);
        updateIndicator();
      }, 350);
    }

    nextBtn.addEventListener("click", () => {
      index = (index + 1) % heroes.length;
      showHero(index, "right");
    });

    prevBtn.addEventListener("click", () => {
      index = (index - 1 + heroes.length) % heroes.length;
      showHero(index, "left");
    });


    fsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    });

    document.getElementById("start-btn").addEventListener("click", () => {
      if (document.getElementById("enable-sound").checked) {
        audio.muted = false;
        audio.play().catch(err => console.log(err));
      }
      startScreen.style.opacity = "0";
      setTimeout(() => {
        startScreen.style.display = "none";
        showHero(index);
      }, 500);
    });

    updateIndicator();
const searchInput = document.getElementById('heroSearch');
const searchResults = document.getElementById('searchResults');
const openSearch = document.getElementById('open-search');
const searchLink = document.getElementById('search-link');
const searchContainer = document.getElementById('search-container');
const closeSearch = document.getElementById('close-search');

// Toggle open
openSearch.addEventListener('click', (e) => {
  e.preventDefault();
  searchLink.style.display = 'none';
  searchContainer.style.display = 'inline-block';
  searchInput.focus();
});

// Toggle close
closeSearch.addEventListener('click', () => {
  searchContainer.style.display = 'none';
  searchLink.style.display = 'block';
  searchResults.style.display = 'none';
  searchInput.value = '';
});

// Search filtering
searchInput.addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase();
  searchResults.innerHTML = '';

  if (term.length < 1) {
    searchResults.style.display = 'none';
    return;
  }

  const filtered = heroes.filter(h => h.name.toLowerCase().includes(term));
  if (filtered.length > 0) {
    filtered.forEach(hero => {
      const div = document.createElement('div');
      div.className = 'result-item';
      div.innerText = hero.name;
      div.onclick = () => {
        const heroIndex = heroes.findIndex(h => h.name === hero.name);
        index = heroIndex;
        showHero(index, "right");
        searchInput.value = '';
        searchResults.style.display = 'none';
      };
      searchResults.appendChild(div);
    });
    searchResults.style.display = 'block';
  } else {
    searchResults.style.display = 'none';
  }
});

// Close results if clicking outside
document.addEventListener('click', (e) => {
  if (!searchContainer.contains(e.target) && e.target !== openSearch) {
    searchResults.style.display = 'none';
  }
});


  </script>
</body>
