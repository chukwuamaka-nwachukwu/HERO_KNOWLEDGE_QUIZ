<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHA Quiz | Toshinori Yagi</title>
  <link rel="shortcut icon" href="../Static/mha_logo.png" type="image/x-icon">
  <style>
    :root {
      --primary: #ffd700;   /* Gold Accent */
      --red: #8b0000;       /* Deep Hero Red */
      --blue: #001a33;      /* Midnight Suit Blue */
      --glass: rgba(0, 5, 15, 0.85);
      --text: #e0e0e0;
    }

    body, html {
      margin: 0; padding: 0; height: 100%;
      background: #050505; font-family: 'Segoe UI', sans-serif;
      color: var(--text); overflow: hidden;
    }

    #bgVideo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; filter: brightness(0.25) contrast(1.1); }
    
    /* DARK OVERLAY */
    .overlay { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: radial-gradient(circle, transparent, rgba(0,0,0,0.75)); 
        z-index: 2; 
    }

    .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 5px; z-index: 10; background: rgba(255,255,255,0.05); }
    #progressBar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--red), var(--primary)); transition: 0.5s; box-shadow: 0 0 15px var(--red); }

    .nav-container { position: fixed; top: 25px; width: 100%; padding: 0 25px; display: flex; justify-content: space-between; z-index: 10; box-sizing: border-box; }
    .circle-btn {
      width: 45px; height: 45px; border-radius: 8px; background: rgba(0,0,0,0.6); color: var(--primary);
      border: 1px solid var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: 0.3s; font-size: 18px;
    }
    .circle-btn:hover { background: var(--primary); color: black; transform: translateY(-2px); }

    .quiz-container { position: relative; z-index: 5; display: flex; justify-content: center; align-items: center; height: 100vh; }

    .quiz-card {
      background: var(--glass); border: 1px solid #333; border-top: 4px solid var(--red);
      width: 90%; max-width: 650px; border-radius: 12px; padding: 45px; text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9);
    }

    #questionText { font-size: 22px; font-weight: 300; margin-bottom: 30px; line-height: 1.4; color: #fff; letter-spacing: 0.5px; }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }

    .option-btn {
      background: rgba(255,255,255,0.03); border: 1px solid #444; padding: 16px; 
      border-radius: 6px; color: #bbb; cursor: pointer; transition: 0.3s; font-size: 15px;
    }
    .option-btn:hover { border-color: var(--primary); color: white; background: rgba(255, 215, 0, 0.05); }
    .option-btn.selected { background: var(--red) !important; color: white !important; border-color: var(--primary); font-weight: bold; }
    .option-btn.hidden { opacity: 0; pointer-events: none; }

    .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; border-top: 1px solid #222; padding-top: 20px; }
    
    .nav-btn {
      background: none; border: none; color: #666; padding: 10px 20px; 
      cursor: pointer; transition: 0.3s; font-size: 13px; font-weight: bold; letter-spacing: 2px;
    }
    .nav-btn:hover:not(:disabled) { color: var(--primary); }
    .nav-btn:disabled { opacity: 0.2; }

    .lifeline-btn { 
        background: transparent; border: 1px solid var(--primary); padding: 8px 18px; 
        border-radius: 4px; color: var(--primary); cursor: pointer; font-size: 11px; font-weight: bold;
        text-transform: uppercase; transition: 0.3s;
    }
    .lifeline-btn:hover:not(:disabled) { background: var(--primary); color: black; }

    /* START SCREEN - UNIFIED STYLE */
    #start-screen {
      position: fixed; inset: 0; background: #000a15; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999;
    }
    #start-screen h1 { font-size: 50px; color: var(--primary); letter-spacing: 15px; margin-bottom: 10px; text-transform: uppercase; }
    #start-screen p { font-style: italic; opacity: 0.5; margin-bottom: 40px; letter-spacing: 2px; }

    #start-btn {
      padding: 18px 50px; background: transparent; border: 1px solid var(--primary);
      font-size: 18px; color: var(--primary); cursor: pointer; transition: 0.4s; letter-spacing: 2px;
    }
    #start-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); }

    .review-area { max-height: 200px; overflow-y: auto; text-align: left; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; border: 1px solid #222; }
 /* Tablet responsiveness */
@media (max-width: 1024px) {
  .quiz-card {
    max-width: 500px;
    padding: 30px;
  }
  #questionText {
    font-size: 20px;
  }
  .option-btn {
    font-size: 14px;
    padding: 14px;
  }
}

/* Mobile responsiveness */
@media (max-width: 768px) {
  .nav-container {
    top: 15px;
    padding: 0 15px;
  }
  .circle-btn {
    width: 38px;
    height: 38px;
    font-size: 16px;
  }

  .quiz-card {
    width: 95%;
    max-width: 360px;
    padding: 20px;
  }

  #questionText {
    font-size: 18px;
    line-height: 1.4;
    margin: 10px 0;
    text-align: center;
  }

  .options-grid {
    grid-template-columns: 1fr; /* stack options vertically */
    gap: 10px;
    margin: 20px 0;
  }

  .option-btn {
    font-size: 14px;
    padding: 12px;
  }

  .controls {
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
    padding-top: 15px;
  }

  .nav-btn {
    font-size: 13px;
    padding: 8px 16px;
  }

  .lifeline-btn {
    font-size: 10px;
    padding: 6px 12px;
  }

  #start-screen h1 {
    font-size: 2rem;
    letter-spacing: 4px;
    text-align: center;
  }
  #start-screen button {
    padding: 12px 30px;
    font-size: 14px;
  }

  .site-footer {
    font-size: 12px;
    padding: 8px 0;
  }
}

/* Extra small phones */
@media (max-width: 480px) {
  .quiz-card {
    max-width: 300px;
    padding: 15px;
  }

  #questionText {
    font-size: 16px;
  }

  .option-btn {
    font-size: 13px;
    padding: 10px;
  }

  .controls {
    gap: 10px;
  }

  .nav-btn {
    font-size: 12px;
    padding: 6px 12px;
  }

  #start-screen h1 {
    font-size: 1.6rem;
    letter-spacing: 2px;
  }
  #start-screen button {
    padding: 10px 25px;
    font-size: 13px;
  }

  .site-footer {
    font-size: 11px;
    padding: 6px 0;
  }
}
  </style>
</head>
<body>

  <div id="start-screen">
    <h1>SYMBOL OF PEACE</h1>
    <p>"Go beyond... Plus Ultra."</p>
    <label style="margin-bottom: 25px; cursor: pointer; font-size: 13px; opacity: 0.7;">
        <input type="checkbox" id="enable-sound"> Synchronize Spirit (Audio)
    </label>
    <button id="start-btn">COMMENCE EVALUATION</button>
  </div>

  <audio id="myAudio" loop>
    <source src="../Static/Yuki_Hayashi_-_My_Hero_Academia_OST_-_You_Say_Run_(mp3.pm).mp3" type="audio/mp3" />
  </audio>

  <div class="progress-container"><div id="progressBar"></div></div>
  <video id="bgVideo" autoplay muted loop playsinline><source src="../Static/all_might_gid.mp4" type="video/mp4"></video>
  <div class="overlay"></div>

  <div class="nav-container">
    <button class="circle-btn" onclick="location.href='../Characters_Selection.html'">✖</button>
    <button class="circle-btn" onclick="document.documentElement.requestFullscreen()">⛶</button>
  </div>

  <div class="quiz-container">
    <div class="quiz-card">
      <div id="game-area">
        <div style="color: var(--primary); font-size: 11px; margin-bottom: 10px; letter-spacing: 3px; font-weight: bold;">
          STAMINA: <span id="qNum">1</span> / 10
        </div>
        <h2 id="questionText">Initializing Hero Data...</h2>
        <div class="options-grid" id="optionsGrid"></div>
        <div class="controls">
          <button class="nav-btn" id="prevBtn" onclick="prevQuestion()">BACK</button>
          <button class="lifeline-btn" id="lifelineBtn" onclick="useLifeline()">DETROIT SMASH! (50/50)</button>
          <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">NEXT</button>
        </div>
      </div>

      <div id="results-area" style="display:none;">
        <h1 id="scoreDisplay" style="font-size: 60px; margin: 0; color: var(--primary);">0/10</h1>
        <p id="remarkText" style="font-weight: bold; margin-bottom: 20px;"></p>
        <div class="review-area" id="reviewList"></div>
        <button class="option-btn" style="width:100%; margin-top:20px; border-color: var(--primary);" onclick="location.reload()">TRY AGAIN (PLUS ULTRA)</button>
      </div>
    </div>
  </div>

<script>
    const audio = document.getElementById("myAudio");
    const startBtn = document.getElementById("start-btn");

    startBtn.addEventListener("click", () => {
        document.getElementById("start-screen").style.display = "none";
        if (document.getElementById("enable-sound").checked) {
            audio.currentTime = 125;
            audio.play().catch(e => console.log(e));
        }
        init();
    });

    const allQuestions = [
        { q: "What is this character's true legal name?", a: "Toshinori Yagi", o: ["Toshinori Yagi", "Enji Todoroki", "Nana Shimura", "Mirio Togata"] },
        { q: "What is the name of the superhero persona he maintains?", a: "All Might", o: ["All For One", "All Might", "Endeavor", "Stain"] },
        { q: "What quirk was passed down to him?", a: "One For All", o: ["One For All", "Engine", "Erasure", "Explosion"] },
        { q: "Who was his female mentor?", a: "Nana Shimura", o: ["Recovery Girl", "Nana Shimura", "Midnight", "Mt. Lady"] },
        { q: "How long was his reign as the Number 1 Hero?", a: "40 Years", o: ["10 Years", "40 Years", "25 Years", "50 Years"] },
        { q: "Which attack is his strongest signature move?", a: "United States of Smash", o: ["Detroit Smash", "United States of Smash", "Oklahoma Smash", "California Smash"] },
        { q: "Which school did he attend as a student?", a: "U.A. High School", o: ["U.A. High School", "Shiketsu", "Ketsubutsu", "Aldera"] },
        { q: "Who was his tactical sidekick?", a: "Sir Nighteye", o: ["Sir Nighteye", "Bubble Girl", "Fat Gum", "Hawks"] },
        { q: "What physical loss did he suffer 5 years ago?", a: "Stomach & Respiratory system", o: ["Left arm", "Stomach & Respiratory system", "His eyesight", "One leg"] },
        { q: "What was his quirk status at birth?", a: "Quirkless", o: ["Quirkless", "Strength type", "Flight type", "Elemental"] },
        { q: "What is his blood type?", a: "A", o: ["A", "B", "O", "AB"] },
        { q: "In which city was he born?", a: "Tokyo", o: ["Tokyo", "Musutafu", "Hosu", "Osaka"] },
        { q: "What is his favorite plant/tree?", a: "Cedar", o: ["Cherry Blossom", "Cedar", "Oak", "Pine"] },
        { q: "Initially, how many hours could he maintain his 'Muscle Form'?", a: "3 Hours", o: ["1 Hour", "3 Hours", "5 Hours", "Unlimited"] },
        { q: "Who designed his specialized support gear?", a: "David Shield", o: ["David Shield", "Mei Hatsume", "Power Loader", "Mellissa Shield"] },
        { q: "What is his height in his transformed state?", a: "220 cm", o: ["200 cm", "220 cm", "250 cm", "190 cm"] },
        { q: "Which 'Smash' is named after a Texas city?", a: "Austin Smash", o: ["Houston Smash", "Austin Smash", "Dallas Smash", "San Antonio Smash"] },
        { q: "What color are his eyes in his skeletal form?", a: "Blue", o: ["Black", "Blue", "Red", "Yellow"] },
        { q: "He was the ____ user of One For All.", a: "8th", o: ["1st", "7th", "8th", "9th"] },
        { q: "What is his primary catchphrase?", a: "I am here!", o: ["I am here!", "Plus Ultra!", "Do not fear!", "Justice is served!"] }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let userSelections = new Array(10).fill(null);
    let lifelineStates = new Array(10).fill(false);

    function init() {
        currentQuestions = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, 10);
        render();
    }

    function render() {
        const q = currentQuestions[currentIndex];
        document.getElementById("qNum").innerText = currentIndex + 1;
        document.getElementById("questionText").innerText = q.q;
        document.getElementById("progressBar").style.width = ((currentIndex + 1) / 10) * 100 + "%";

        const grid = document.getElementById("optionsGrid");
        grid.innerHTML = "";
        q.o.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = `option-btn ${userSelections[currentIndex] === opt ? 'selected' : ''}`;
            btn.innerText = opt;
            btn.onclick = () => { userSelections[currentIndex] = opt; render(); };
            grid.appendChild(btn);
        });

        document.getElementById("prevBtn").disabled = currentIndex === 0;
        document.getElementById("nextBtn").innerText = currentIndex === 9 ? "COMPLETE" : "NEXT";
        document.getElementById("lifelineBtn").disabled = lifelineStates[currentIndex];
    }

    function nextQuestion() {
        if (currentIndex < 9) { currentIndex++; render(); } 
        else { finish(); }
    }

    function prevQuestion() { if (currentIndex > 0) { currentIndex--; render(); } }

    function useLifeline() {
        if (lifelineStates[currentIndex]) return;
        const q = currentQuestions[currentIndex];
        const buttons = Array.from(document.querySelectorAll(".option-btn"));
        let count = 0;
        buttons.forEach(b => {
            if (b.innerText !== q.a && count < 2) {
                b.classList.add("hidden");
                count++;
            }
        });
        lifelineStates[currentIndex] = true;
        document.getElementById("lifelineBtn").disabled = true;
    }

    function finish() {
        let score = 0;
        const review = document.getElementById("reviewList");
        review.innerHTML = "";
        currentQuestions.forEach((q, i) => {
            const correct = userSelections[i] === q.a;
            if (correct) score++;
            review.innerHTML += `<div style="margin-bottom:10px; border-left:3px solid ${correct ? 'var(--primary)' : 'var(--red)'}; padding-left:12px;">
                <div style="font-size:14px;">${q.q}</div>
                <div style="font-size:12px; color:var(--primary)">ANSWER: ${q.a}</div>
            </div>`;
        });
        document.getElementById("game-area").style.display = "none";
        document.getElementById("results-area").style.display = "block";
        document.getElementById("scoreDisplay").innerText = score + "/10";
        document.getElementById("remarkText").innerText = score > 7 ? "YOU ARE THE NEXT SYMBOL OF PEACE!" : "YOU CAN BE A HERO! KEEP TRAINING!";
    }
</script>
</body>
</html>
